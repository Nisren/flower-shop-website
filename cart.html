<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Paris Flowers</title>

  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="website_templatecss.css">
</head>

<body>

<nav class="navbar navbar-expand-md navbar-light main-navbar">
  <div class="container nav-container">
    <a class="navbar-brand" href="website_template.html">
      <img src="images/FLOWER0.png" alt="Paris Flowers">
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav">
      <i class="fa fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav nav-menu">
        <li class="nav-item"><a class="nav-link" href="website_template.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="website_template.html#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="website_template.html#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="website_template.html#contact">Contact</a></li>
      </ul>

      <div class="nav-actions">

  <!-- Search -->
  <form class="nav-search" onsubmit="return false;">
    <input type="text" id="searchInput" placeholder="Search...">
  </form>

  <!-- Cart -->
  <a class="cart-button" href="cart.html">
    <i class="fa fa-shopping-cart"></i>
    <span class="my-cart-badge">0</span>
  </a>

  <!-- User (Login / Name) -->
  <div id="userArea"></div>

</div>
    </div>
  </div>
</nav>

<section class="cart-hero">
  <div class="container text-center">
    <h1>Your Cart</h1>
    <p>Review your selected flowers before checkout.</p>
  </div>
</section>

<section class="cart-section">
  <div class="container">
    <div id="cartItems" class="cart-items"></div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <p>Total Items: <span id="totalItems">0</span></p>
      <h4>Total: $<span id="totalPrice">0</span></h4>

      <button class="checkout-btn" onclick="checkout()">Checkout</button>
      <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>
</section>

<script src="jquery-2.2.3.min.js"></script>
<script src="bootstrap.min.js"></script>
<script src="script.js"></script>

</body>
</html>
